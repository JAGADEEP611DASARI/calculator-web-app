<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator with keyboard support.">
  <title>Calc — Simple Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="brand" href="#" aria-label="Calc home"><span>◈</span> calc.</a>
      <p>Simple tools. Clear thinking.</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="calc-top"><span class="calc-label">STANDARD</span><span class="mode-dot" aria-hidden="true"></span></div>
      <div class="display" aria-live="polite" aria-atomic="true">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>
      <div class="keypad" id="keypad">
        <button class="key utility" data-action="clear" aria-label="All clear">AC</button>
        <button class="key utility" data-action="sign" aria-label="Change sign">±</button>
        <button class="key utility" data-action="percent" aria-label="Percent">%</button>
        <button class="key operator" data-value="/" aria-label="Divide">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+" aria-label="Add">+</button>

        <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value="." aria-label="Decimal point">.</button>
        <button class="key equals" data-action="equals" aria-label="Equals">=</button>
      </div>
      <p class="keyboard-hint">Keyboard supported · Esc to clear · Enter to calculate</p>
    </section>

    <footer><span>CALC / 01</span><span>Made for everyday math</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
